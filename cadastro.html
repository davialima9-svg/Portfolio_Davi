<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="container">
        <div class="login-box">
            <h1>Criar Conta</h1>
            <p class="subtitulo">Preencha seus dados para se cadastrar</p>

            <form id="cadastroForm">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="Digite seu CPF" maxlength="11" inputmode="numeric" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" maxlength="8" inputmode="numeric" required>

                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" placeholder="Repita a senha" maxlength="8" inputmode="numeric" required>

                <button type="submit" id="botaoCadastrar">Cadastrar</button>
            </form>

            <p id="mensagem"></p>

            <p class="cadastro-link">Já tem conta? <a href="index.html">Fazer login</a></p>
        </div>
    </main>

    <footer>
        © <span id="ano"></span> Davi Luz. Todos os direitos reservados.
    </footer>

    <script src="cadastro.js"></script>
</body>
</html>
